<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Resources | Enggii Tea</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="logo">ENGGII TEA<small>Engineering Mathematics Resource Hub</small></a>
    <button class="menu-btn" type="button" aria-label="Toggle menu">☰</button>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="dashboard.html">Topics</a>
      <a href="formulas.html">Formulas</a>
      <a href="calculators.html">Calculators</a>
      <a href="graphs.html">Graphs</a>

      <a href="about.html">About</a>
      <span id="authArea"></span>
    </nav>
  </div>
</header>

<main class="page math-bg">
  <div class="container">
    <h1 class="page-title">My Resources</h1>
    <p class="page-subtitle">Resources you have submitted to Enggii Tea.</p>

    <div id="myResourcesContainer">
      <div class="loading"><div class="spinner"></div>Loading your resources...</div>
    </div>
  </div>
</main>

<footer class="footer">© 2026 Enggii Tea · Engineering Mathematics Resource Hub</footer>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/main.js"></script>

<script>
document.addEventListener("DOMContentLoaded", loadMyResources);

async function loadMyResources() {
  const container = document.querySelector("#myResourcesContainer");

  /* GET /api/auth/me via scripts/api.js — redirects to the
     login page when there is no valid backend session. */
  const user = await requireAuth();
  if (!user) return;

  try {
    /* GET /api/resources/user/my-resources — protected route,
       returns resources of every status uploaded by this user. */
    const body = await apiFetch("/api/resources/user/my-resources");
    const resources = body.data || [];

    if (resources.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>No Resources Yet</h3>
          <p>You haven't uploaded any resources.</p><br>
          <a href="upload.html" class="btn btn-primary">Upload Resource</a>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="resource-grid">${resources.map(myResourceCard).join("")}</div>`;

    document.querySelectorAll(".delete-resource").forEach(button => {
      button.addEventListener("click", handleDeleteResource);
    });

  } catch (err) {
    console.error("Unable to load resources:", err);
    container.innerHTML = `<div class="alert alert-error">${escapeHTML(apiErrorMessage(err))}<br><br>Please try again.</div>`;
  }
}

function myResourceCard(resource) {
  const id = resource.id;
  const title = resource.title || "Untitled Resource";
  const type = resource.resource_type || "Resource";
  const status = resource.status || "pending";

  return `
    <article class="resource-card">
      <span class="resource-type">${escapeHTML(type)}</span>
      <h3>${escapeHTML(title)}</h3>
      <p>Status: <strong>${escapeHTML(status)}</strong></p>
      <div class="resource-actions" style="display:flex; gap:10px; margin-top:auto;">
        <a href="resource.html?id=${encodeURIComponent(id)}" class="btn btn-primary btn-sm">View</a>
        <button type="button" class="btn btn-danger btn-sm delete-resource" data-id="${escapeHTML(id)}">Delete</button>
      </div>
    </article>
  `;
}

async function handleDeleteResource(event) {
  const button = event.currentTarget;
  const id = button.dataset.id;
  if (!id) { alert("Resource ID not found."); return; }

  if (!confirm("Are you sure you want to delete this resource?")) return;

  button.disabled = true;
  button.textContent = "Deleting...";

  try {
    /* DELETE /api/resources/:id — protected route; the backend
       allows the owner or an admin to delete. */
    await apiFetch("/api/resources/" + encodeURIComponent(id), { method: "DELETE" });

    window.location.reload();
  } catch (err) {
    console.error("Unable to delete resource:", err);
    alert(apiErrorMessage(err));
    button.disabled = false;
    button.textContent = "Delete";
  }
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>

</body>
</html>
