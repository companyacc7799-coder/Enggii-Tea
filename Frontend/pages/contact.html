<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Enggii Tea</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<header class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="logo">ENGGII TEA<small>Engineering Mathematics Resource Hub</small></a>
    <button class="menu-btn" type="button" aria-label="Toggle menu">☰</button>
    <nav class="nav-links">
      <a href="../index.html">Home</a>
      <a href="dashboard.html">Topics</a>
      <a href="formulas.html">Formulas</a>
      <a href="calculators.html">Calculators</a>
      <a href="graphs.html">Graphs</a>

      <a href="about.html">About</a>
      <span id="authArea"></span>
    </nav>
  </div>
</header>

<main class="page math-bg">
  <div class="container" style="max-width:600px;">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-subtitle">Questions, corrections or a resource to suggest — send it our way.</p>

    <div class="form-card">
      <div id="contactMessage" class="message" style="display:none;"></div>
      <form id="contactForm">
        <div class="form-group">
          <label for="contactName">Name</label>
          <input type="text" id="contactName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="contactMsg">Message</label>
          <textarea id="contactMsg" class="form-control" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Message</button>
      </form>
    </div>
  </div>
</main>

<footer class="footer">© 2026 Enggii Tea · Engineering Mathematics Resource Hub</footer>

<script src="../scripts/api.js"></script>
<script src="../scripts/auth.js"></script>
<script src="../scripts/main.js"></script>

<script>
/* This form is currently a front-end stub. To make it functional,
   wire it to your own backend endpoint. */
document.getElementById("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const box = document.getElementById("contactMessage");
  box.style.display = "block";
  box.className = "message success";
  box.textContent = "Thanks — your message has been noted. We'll get back to you soon.";
  e.target.reset();
});
</script>

</body>
</html>
