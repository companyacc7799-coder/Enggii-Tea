<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <g fill="none" stroke="#6C5CE7" stroke-width="1.4" stroke-linecap="round" opacity="0.16">
    <!-- pi -->
    <text x="18" y="52" font-family="Georgia, serif" font-size="34" stroke="none" fill="#6C5CE7">π</text>
    <!-- integral -->
    <text x="150" y="40" font-family="Georgia, serif" font-size="40" stroke="none" fill="#6C5CE7">∫</text>
    <!-- square root -->
    <path d="M248 40 l8 18 l10 -30 h20" />
    <!-- x mark -->
    <path d="M40 120 l16 16 M56 120 l-16 16" />
    <!-- sigma -->
    <text x="120" y="140" font-family="Georgia, serif" font-size="32" stroke="none" fill="#6C5CE7">Σ</text>
    <!-- plus minus -->
    <text x="220" y="130" font-family="Georgia, serif" font-size="26" stroke="none" fill="#6C5CE7">±</text>
    <!-- ruler -->
    <rect x="280" y="150" width="60" height="14" rx="2" transform="rotate(-18 280 150)" />
    <line x1="286" y1="146" x2="286" y2="152" transform="rotate(-18 280 150)" />
    <line x1="298" y1="144" x2="298" y2="152" transform="rotate(-18 280 150)" />
    <line x1="310" y1="146" x2="310" y2="152" transform="rotate(-18 280 150)" />
    <!-- protractor -->
    <path d="M20 220 a30 30 0 0 1 60 0 z" />
    <line x1="50" y1="220" x2="50" y2="196" />
    <line x1="50" y1="220" x2="72" y2="203" />
    <!-- coordinate axes -->
    <line x1="140" y1="260" x2="140" y2="200" />
    <line x1="110" y1="230" x2="200" y2="230" />
    <path d="M140 200 l-5 8 M140 200 l5 8" />
    <path d="M200 230 l-8 -5 M200 230 l-8 5" />
    <circle cx="170" cy="215" r="3" fill="#6C5CE7" stroke="none"/>
    <!-- function curve -->
    <path d="M230 260 q20 -40 40 0 t40 0" />
    <!-- percent -->
    <text x="70" y="300" font-family="Georgia, serif" font-size="26" stroke="none" fill="#6C5CE7">%</text>
    <!-- infinity -->
    <text x="230" y="320" font-family="Georgia, serif" font-size="28" stroke="none" fill="#6C5CE7">∞</text>
    <!-- multiply -->
    <path d="M300 280 l14 14 M314 280 l-14 14" />
    <!-- small numbers -->
    <text x="10" y="345" font-family="Georgia, serif" font-size="18" stroke="none" fill="#6C5CE7">2ⁿ</text>
  </g>
</svg>
